name: One-shot request latency telemetry v2

on:
  push:
    branches: [perf/request-latency-telemetry]

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-latency-telemetry
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instrument request pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(s, old, new, label):
              n=s.count(old)
              if n != 1: raise RuntimeError(f'{label}: expected 1 match, got {n}')
              return s.replace(old,new,1)

          p=Path('src/runtime/ui-response-monitor.ts')
          s=p.read_text()
          s=once(s, '''export interface UiResponseResult {
            text: string;
            deltas: string[];
          }''', '''export interface UiResponseResult {
            text: string;
            deltas: string[];
            firstDeltaMs?: number;
            durationMs: number;
          }''', 'response result')
          s=once(s, '''  const deadline = Date.now() + config.uiResponseTimeoutMs;
            const deltas: string[] = [];''', '''  const startedAt = Date.now();
            const deadline = startedAt + config.uiResponseTimeoutMs;
            const deltas: string[] = [];
            let firstDeltaMs: number | undefined;''', 'response timer')
          s=once(s, '''        if (delta) {
                  streamedText = active.text.trim();''', '''        if (delta) {
                  if (firstDeltaMs === undefined) firstDeltaMs = Math.max(0, Date.now() - startedAt);
                  streamedText = active.text.trim();''', 'first delta')
          old='return { text: lastText, deltas };'
          n=s.count(old)
          if n != 2: raise RuntimeError(f'response returns: expected 2 matches, got {n}')
          s=s.replace(old, 'return { text: lastText, deltas, firstDeltaMs, durationMs: Math.max(0, Date.now() - startedAt) };')
          p.write_text(s)

          p=Path('src/runtime/ui-executor.ts')
          s=p.read_text()
          s=once(s, '''  async execute(body: JsonObject, options?: ChatExecutionOptions): Promise<ChatExecutionResult> {
              throwIfAborted(options?.signal);''', '''  async execute(body: JsonObject, options?: ChatExecutionOptions): Promise<ChatExecutionResult> {
              const executionStartedAt = Date.now();
              throwIfAborted(options?.signal);''', 'executor start')
          s=once(s, '''    const artifactBaseline = await extractArtifactContents(this.session.page).catch(() => []);
              const baseline = await collectVisibleSnapshots(this.session.page, this.provider.ui.responseSelectors);
              await this.sendPrompt(prompt, options?.signal);

              const bufferResponse = requestMayReturnToolCalls(body) || Boolean(structured);''', '''    const artifactBaseline = await extractArtifactContents(this.session.page).catch(() => []);
              const baseline = await collectVisibleSnapshots(this.session.page, this.provider.ui.responseSelectors);
              const promptSendStartedAt = Date.now();
              await this.sendPrompt(prompt, options?.signal);
              const promptSentAt = Date.now();

              const bufferResponse = requestMayReturnToolCalls(body) || Boolean(structured);''', 'prompt send')
          s=once(s, '''    const execution: ChatExecutionResult = {
              completion: output,
              deltas,
              ...(structuredOutputFailed ? { metadata: { structured_output: 'failed' } } : {})
            };''', '''    const timing: JsonObject = {
              transport: 'ui',
              ui_prepare_ms: Math.max(0, promptSendStartedAt - executionStartedAt),
              ui_prompt_send_ms: Math.max(0, promptSentAt - promptSendStartedAt),
              ui_response_ttft_ms: result.firstDeltaMs ?? result.durationMs,
              ui_response_wait_ms: result.durationMs,
              ui_executor_total_ms: Math.max(0, Date.now() - executionStartedAt)
            };
            const execution: ChatExecutionResult = {
              completion: output,
              deltas,
              metadata: {
                ...(structuredOutputFailed ? { structured_output: 'failed' } : {}),
                timing
              }
            };''', 'executor metadata')
          p.write_text(s)

          p=Path('src/runtime/session-manager.ts')
          s=p.read_text()
          s=once(s, "import { SerialQueue } from './serial-queue.js';\n", "import { SerialQueue } from './serial-queue.js';\nimport { logger } from '../logger.js';\n", 'logger import')
          old='''  async execute(requestedId: string | undefined, body: JsonObject, options?: ChatExecutionOptions): Promise<ChatExecutionResult> {
              const session = await this.resolve(requestedId);
              updateRequestContext({ sessionId: session.id, provider: session.provider });
              session.lastActivity = Date.now();
              const queuedAt = Date.now();
              return session.queue.run(async () => {
                telemetry.recordQueueWait(session.provider, Date.now() - queuedAt);
                session.status = 'busy';
                session.lastActivity = Date.now();
                try {
                  return await session.executor.execute(body, options);
                } finally {
                  session.lastActivity = Date.now();
                  session.status = 'idle';
                }
              }, options?.signal);
            }'''
          new='''  async execute(requestedId: string | undefined, body: JsonObject, options?: ChatExecutionOptions): Promise<ChatExecutionResult> {
              const requestStartedAt = Date.now();
              const session = await this.resolve(requestedId);
              const resolvedAt = Date.now();
              updateRequestContext({ sessionId: session.id, provider: session.provider });
              session.lastActivity = Date.now();
              const queuedAt = Date.now();
              return session.queue.run(async () => {
                const dequeuedAt = Date.now();
                const queueWaitMs = Math.max(0, dequeuedAt - queuedAt);
                telemetry.recordQueueWait(session.provider, queueWaitMs);
                session.status = 'busy';
                session.lastActivity = Date.now();
                const executorStartedAt = Date.now();
                try {
                  const result = await session.executor.execute(body, options);
                  const completedAt = Date.now();
                  const timing: JsonObject = {
                    session_resolve_ms: Math.max(0, resolvedAt - requestStartedAt),
                    queue_wait_ms: queueWaitMs,
                    executor_ms: Math.max(0, completedAt - executorStartedAt),
                    total_ms: Math.max(0, completedAt - requestStartedAt),
                    transport: session.executor.transport,
                    ...(result.metadata?.timing !== undefined ? { executor_timing: result.metadata.timing } : {})
                  };
                  logger.event('info', 'chat.timing', timing);
                  return { ...result, metadata: { ...(result.metadata ?? {}), timing } };
                } catch (error) {
                  const failedAt = Date.now();
                  logger.event('warn', 'chat.timing', {
                    session_resolve_ms: Math.max(0, resolvedAt - requestStartedAt),
                    queue_wait_ms: queueWaitMs,
                    executor_ms: Math.max(0, failedAt - executorStartedAt),
                    total_ms: Math.max(0, failedAt - requestStartedAt),
                    transport: session.executor.transport,
                    outcome: 'error'
                  });
                  throw error;
                } finally {
                  session.lastActivity = Date.now();
                  session.status = 'idle';
                }
              }, options?.signal);
            }'''
          s=once(s,old,new,'session execute')
          p.write_text(s)

          p=Path('test/session-manager.test.ts')
          s=p.read_text()
          s += '''\n\ntest('session manager attaches per-request timing metadata', async () => {\n  const manager = new SessionManager({ defaultExecutor: executor('default'), provider: 'chatgpt', config });\n  try {\n    const result = await manager.execute(undefined, { messages: [{ role: 'user', content: 'timing' }] });\n    const timing = result.metadata?.timing as JsonObject | undefined;\n    assert.ok(timing);\n    assert.equal(timing.transport, 'ui');\n    for (const key of ['session_resolve_ms', 'queue_wait_ms', 'executor_ms', 'total_ms']) {\n      assert.equal(typeof timing[key], 'number');\n      assert.ok((timing[key] as number) >= 0);\n    }\n  } finally { await manager.close(); }\n});\n'''
          p.write_text(s)
          PY
          git diff --check
      - name: Validate telemetry
        run: |
          npm ci
          npm run verify
      - name: Commit implementation
        run: |
          rm -f .github/workflows/one-shot-request-latency-telemetry.yml .github/workflows/one-shot-request-latency-telemetry-v2.yml
          git config user.name 'kitt-telemetry-bot'
          git config user.email 'kitt-telemetry-bot@users.noreply.github.com'
          git add -A
          git commit -m 'perf(metrics): instrument proxy latency phases'
          git push origin HEAD:perf/request-latency-telemetry
