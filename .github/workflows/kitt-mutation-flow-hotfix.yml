name: KITT mutation flow hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kitt-mutation-flow-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply patch
        run: python .github/scripts/apply-mutation-hotfix.py
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Commit validated fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/tool-policy.ts src/runtime/tool-enforcement.ts src/runtime/ui-executor.ts test/tool-enforcement.test.ts test/direct-mutation-fast-path.test.ts
          git diff --cached --check
          git commit -m "fix: enforce filesystem mutations through tool protocol"
          git push origin HEAD:main
