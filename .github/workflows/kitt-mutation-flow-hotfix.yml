name: KITT mutation flow hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kitt-mutation-flow-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: contains(github.event.head_commit.message, 'chore: apply mutation flow hardening')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply mutation-flow fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Runtime operation classification must understand every safe filesystem mutation.
          replace_once(
              'src/runtime/tool-policy.ts',
              "  ['repo.edit_symbol', 'mutate'],\n",
              "  ['repo.edit_symbol', 'mutate'],\n"
              "  ['repo.write_file', 'mutate'],\n"
              "  ['repo.create_directory', 'mutate'],\n"
              "  ['repo.move', 'mutate'],\n"
              "  ['repo.rename', 'mutate'],\n"
              "  ['repo.delete', 'mutate'],\n",
          )

          path = 'src/runtime/tool-enforcement.ts'
          replace_once(
              path,
              "const DIRECT_FILESYSTEM_MUTATION =\n"
              "  /^\\s*(?:(?:por favor|please)\\s+)?(?:(?:crie|criar|create|make)\\s+(?:(?:um|uma|a|an)\\s+)?(?:pasta|diret[oó]rio|folder|directory)\\b|(?:execute|executar|rode|run)\\s*:?\\s*(?:mkdir|touch)\\b)/i;\n",
              "const MUTATION_INTENT =\n"
              "  /\\b(?:fix|corrig(?:ir|a|e|indo)?|implement(?:ar|e|a)?|add|adicion(?:ar|e|a)?|remove|remov(?:er|a)|refactor|refator(?:ar|e)|improve|melhor(?:ar|e)|aprimor(?:ar|e)|change|alter(?:ar|e)|edit|editar|create|criar|update|atualiz(?:ar|e)|delete|deletar|excluir|move|mover|rename|renomear)\\b/i;\n"
              "const DIRECT_FILESYSTEM_MUTATION =\n"
              "  /^\\s*(?:(?:por favor|please)\\s+)?(?:(?:crie|criar|create|make)\\s+(?:(?:um|uma|a|an)\\s+)?(?:pasta|diret[oó]rio|folder|directory)\\b|(?:execute|executar|rode|run)\\s*:?\\s*(?:mkdir|touch)\\b)/i;\n"
              "const DIRECT_FILE_CREATION =\n"
              "  /^\\s*(?:(?:por favor|please)\\s+)?(?:crie|criar|create|make)\\s+(?:(?:um|uma|a|an)\\s+)?(?:arquivo|file)\\s+[`\\\"'@]?[-A-Za-z0-9_./\\\\]+\\.[A-Za-z0-9]{1,16}\\b/i;\n",
          )
          replace_once(path, "      | 'tool_required'\n", "      | 'tool_required'\n      | 'mutation_required'\n")
          replace_once(path, "  requireAnyTool: boolean;\n", "  requireAnyTool: boolean;\n  requireMutation: boolean;\n")
          replace_once(
              path,
              "      requireAnyTool: false,\n      explorationToolNames: []\n",
              "      requireAnyTool: false,\n      requireMutation: false,\n      explorationToolNames: []\n",
          )
          replace_once(
              path,
              "  const directFilesystemMutation = DIRECT_FILESYSTEM_MUTATION.test(latestUserText);\n"
              "  const workspaceDependent = !directFilesystemMutation && isWorkspaceDependentRequest(latestUserText);\n",
              "  const directFilesystemMutation = DIRECT_FILESYSTEM_MUTATION.test(latestUserText)\n"
              "    || DIRECT_FILE_CREATION.test(latestUserText);\n"
              "  const workspaceDependent = !directFilesystemMutation && isWorkspaceDependentRequest(latestUserText);\n",
          )
          replace_once(
              path,
              "  const requireExploration = explorationTools.length > 0 && workspaceDependent;\n\n  return {\n",
              "  const requireExploration = explorationTools.length > 0 && workspaceDependent;\n"
              "  const requireMutation = directFilesystemMutation\n"
              "    || (workspaceDependent && MUTATION_INTENT.test(latestUserText));\n\n  return {\n",
          )
          replace_once(
              path,
              "    requireAnyTool: mode === 'required' || directFilesystemMutation,\n    explorationToolNames: explorationTools.map((tool) => tool.name)\n",
              "    requireAnyTool: mode === 'required' || directFilesystemMutation,\n    requireMutation,\n    explorationToolNames: explorationTools.map((tool) => tool.name)\n",
          )
          replace_once(
              path,
              "  explorationEvidence: boolean;\n  toolEvidence: boolean;\n}): void {\n",
              "  explorationEvidence: boolean;\n  toolEvidence: boolean;\n  mutationEvidence?: boolean;\n}): void {\n",
          )
          replace_once(
              path,
              "    explorationEvidence,\n    toolEvidence\n  } = input;\n",
              "    explorationEvidence,\n    toolEvidence,\n    mutationEvidence = false\n  } = input;\n",
          )
          replace_once(
              path,
              "  if (enforcement.requireAnyTool && !toolEvidence && calls.length === 0) {\n",
              "  if (enforcement.requireMutation && !mutationEvidence) {\n"
              "    const mutations = calls.filter((call) => isMutationToolCall(call, protocol));\n"
              "    if (mutations.length === 0) {\n"
              "      throw new ToolEnforcementError(\n"
              "        'A mutation tool call is required to complete the requested workspace change; returning code, an artifact, or prose is not sufficient.',\n"
              "        'mutation_required'\n"
              "      );\n"
              "    }\n"
              "    return;\n"
              "  }\n\n"
              "  if (enforcement.requireAnyTool && !toolEvidence && calls.length === 0) {\n",
          )
          replace_once(
              path,
              "  enforcement: ToolEnforcementPlan,\n  explorationEvidence: boolean,\n  toolEvidence: boolean\n): string {\n",
              "  enforcement: ToolEnforcementPlan,\n  explorationEvidence: boolean,\n  toolEvidence: boolean,\n  mutationEvidence = false\n): string {\n",
          )
          replace_once(
              path,
              "  } else if (enforcement.requireAnyTool && !toolEvidence) {\n    lines.push(\n      'You MUST call at least one available tool before returning a final answer.',\n      'Return only a tool call now.'\n    );\n  }\n",
              "  } else if (enforcement.requireMutation && !mutationEvidence) {\n"
              "    lines.push(\n"
              "      'You MUST complete the requested workspace mutation through an available mutation tool before returning a final answer.',\n"
              "      'Returning code, a canvas/artifact, or prose does not count as applying the change.',\n"
              "      'Return only the mutation tool call now.'\n"
              "    );\n"
              "  } else if (enforcement.requireAnyTool && !toolEvidence) {\n"
              "    lines.push(\n"
              "      'You MUST call at least one available tool before returning a final answer.',\n"
              "      'Return only a tool call now.'\n"
              "    );\n"
              "  }\n",
          )
          replace_once(
              path,
              "  return [\n    '[KITT ENFORCEMENT RETRY]',\n    'Your previous response did not call a required tool.',\n",
              "  if (error.reason === 'mutation_required') {\n"
              "    return [\n"
              "      '[KITT ENFORCEMENT RETRY]',\n"
              "      'Your previous response did not apply the requested workspace change.',\n"
              "      'A code block, canvas/artifact, or explanation is not a filesystem mutation.',\n"
              "      'Call one available write/edit/patch/create/delete/move tool now and return no final answer.',\n"
              "      '[END KITT ENFORCEMENT RETRY]'\n"
              "    ].join('\\n');\n"
              "  }\n\n"
              "  return [\n    '[KITT ENFORCEMENT RETRY]',\n    'Your previous response did not call a required tool.',\n",
          )

          # Track successful mutation tool results independently from exploration results.
          path = 'src/runtime/ui-executor.ts'
          replace_once(path, "  isExplorationToolCall,\n", "  isExplorationToolCall,\n  isMutationToolCall,\n")
          replace_once(
              path,
              "  private explorationEvidence = false;\n  private toolEvidence = false;\n  private readonly explorationCallIds = new Set<string>();\n",
              "  private explorationEvidence = false;\n"
              "  private mutationEvidence = false;\n"
              "  private toolEvidence = false;\n"
              "  private readonly explorationCallIds = new Set<string>();\n"
              "  private readonly mutationCallIds = new Set<string>();\n",
          )
          replace_once(
              path,
              "    this.explorationEvidence = false;\n    this.toolEvidence = false;\n    this.explorationCallIds.clear();\n",
              "    this.explorationEvidence = false;\n"
              "    this.mutationEvidence = false;\n"
              "    this.toolEvidence = false;\n"
              "    this.explorationCallIds.clear();\n"
              "    this.mutationCallIds.clear();\n",
          )
          replace_once(
              path,
              "  private rememberToolCall(call: OpenAiToolCall, exploration: boolean): void {\n",
              "  private rememberToolCall(call: OpenAiToolCall, exploration: boolean, mutation: boolean): void {\n",
          )
          replace_once(
              path,
              "        this.explorationCallIds.delete(oldest);\n",
              "        this.explorationCallIds.delete(oldest);\n        this.mutationCallIds.delete(oldest);\n",
          )
          replace_once(
              path,
              "    if (exploration) this.explorationCallIds.add(call.id);\n",
              "    if (exploration) this.explorationCallIds.add(call.id);\n    if (mutation) this.mutationCallIds.add(call.id);\n",
          )
          replace_once(
              path,
              "      this.explorationEvidence = false;\n      this.toolEvidence = false;\n      this.explorationCallIds.clear();\n",
              "      this.explorationEvidence = false;\n"
              "      this.mutationEvidence = false;\n"
              "      this.toolEvidence = false;\n"
              "      this.explorationCallIds.clear();\n"
              "      this.mutationCallIds.clear();\n",
          )
          replace_once(
              path,
              "        if (callId && this.explorationCallIds.has(callId)) this.explorationEvidence = true;\n",
              "        if (callId && this.explorationCallIds.has(callId)) this.explorationEvidence = true;\n"
              "        if (callId && this.mutationCallIds.has(callId)) this.mutationEvidence = true;\n",
          )
          replace_once(
              path,
              "          this.explorationCallIds.delete(callId);\n",
              "          this.explorationCallIds.delete(callId);\n          this.mutationCallIds.delete(callId);\n",
          )
          replace_once(
              path,
              "    prefix = `${prefix}${buildToolEnforcementDirective(enforcement, this.explorationEvidence, this.toolEvidence)}`;\n",
              "    prefix = `${prefix}${buildToolEnforcementDirective(enforcement, this.explorationEvidence, this.toolEvidence, this.mutationEvidence)}`;\n",
          )
          replace_once(
              path,
              "          explorationEvidence: this.explorationEvidence,\n          toolEvidence: this.toolEvidence\n",
              "          explorationEvidence: this.explorationEvidence,\n"
              "          toolEvidence: this.toolEvidence,\n"
              "          mutationEvidence: this.mutationEvidence\n",
          )
          replace_once(
              path,
              "      this.rememberToolCall(call, isExplorationToolCall(call, plan));\n",
              "      this.rememberToolCall(call, isExplorationToolCall(call, plan), isMutationToolCall(call, plan));\n",
          )

          # Update regression tests so mutation intent cannot end as plain text/artifact.
          path = 'test/tool-enforcement.test.ts'
          replace_once(
              path,
              "test('after exploration evidence a final answer and writes are allowed', () => {\n"
              "  const p = protocol();\n"
              "  const enforcement = buildToolEnforcementPlan(p, 'corrija o arquivo', 'explore-first');\n"
              "  assert.doesNotThrow(() => enforceToolResponse({\n"
              "    enforcement,\n"
              "    protocol: p,\n"
              "    calls: [],\n"
              "    explorationEvidence: true,\n"
              "    toolEvidence: true\n"
              "  }));\n"
              "  assert.doesNotThrow(() => enforceToolResponse({\n"
              "    enforcement,\n"
              "    protocol: p,\n"
              "    calls: [call('write_file', { path: 'a.ts', content: 'x' })],\n"
              "    explorationEvidence: true,\n"
              "    toolEvidence: true\n"
              "  }));\n"
              "});\n",
              "test('after exploration evidence mutation requests still require a mutation tool result', () => {\n"
              "  const p = protocol();\n"
              "  const enforcement = buildToolEnforcementPlan(p, 'corrija o arquivo', 'explore-first');\n"
              "  assert.equal(enforcement.requireMutation, true);\n"
              "  assert.throws(() => enforceToolResponse({\n"
              "    enforcement,\n"
              "    protocol: p,\n"
              "    calls: [],\n"
              "    explorationEvidence: true,\n"
              "    toolEvidence: true\n"
              "  }), (error: unknown) => error instanceof ToolEnforcementError && error.reason === 'mutation_required');\n"
              "  assert.doesNotThrow(() => enforceToolResponse({\n"
              "    enforcement,\n"
              "    protocol: p,\n"
              "    calls: [call('write_file', { path: 'a.ts', content: 'x' })],\n"
              "    explorationEvidence: true,\n"
              "    toolEvidence: true\n"
              "  }));\n"
              "  assert.doesNotThrow(() => enforceToolResponse({\n"
              "    enforcement,\n"
              "    protocol: p,\n"
              "    calls: [],\n"
              "    explorationEvidence: true,\n"
              "    toolEvidence: true,\n"
              "    mutationEvidence: true\n"
              "  }));\n"
              "});\n",
          )
          replace_once(
              path,
              "  assert.equal(runtimeOperationEffect('state.set'), 'mutate');\n",
              "  for (const operation of ['repo.write_file', 'repo.create_directory', 'repo.move', 'repo.rename', 'repo.delete']) {\n"
              "    assert.equal(runtimeOperationEffect(operation), 'mutate', operation);\n"
              "    assert.equal(isMutationToolCall(runtimeCall(operation), p), true, operation);\n"
              "  }\n\n"
              "  assert.equal(runtimeOperationEffect('state.set'), 'mutate');\n",
          )

          path = 'test/direct-mutation-fast-path.test.ts'
          replace_once(
              path,
              "  assert.equal(plan.requireAnyTool, true);\n});\n\ntest('direct mkdir command",
              "  assert.equal(plan.requireAnyTool, true);\n"
              "  assert.equal(plan.requireMutation, true);\n"
              "});\n\n"
              "test('direct file creation requires a mutation tool without workspace exploration', () => {\n"
              "  const plan = buildToolEnforcementPlan(protocol, 'crie um arquivo src/new-file.ts', 'explore-first');\n"
              "  assert.equal(plan.enabled, true);\n"
              "  assert.equal(plan.workspaceDependent, false);\n"
              "  assert.equal(plan.requireExploration, false);\n"
              "  assert.equal(plan.requireMutation, true);\n"
              "});\n\n"
              "test('direct mkdir command",
          )
          replace_once(
              path,
              "  }), /At least one tool call is required/);\n",
              "  }), /mutation tool call is required/i);\n",
          )

          # Ensure the source still type-checks syntactically before installing dependencies.
          for required in [
              'src/runtime/tool-enforcement.ts',
              'src/runtime/tool-policy.ts',
              'src/runtime/ui-executor.ts',
              'test/tool-enforcement.test.ts',
              'test/direct-mutation-fast-path.test.ts',
          ]:
              if not Path(required).read_text(encoding='utf-8').strip():
                  raise SystemExit(f'{required} unexpectedly empty')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Commit fixes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/tool-policy.ts src/runtime/tool-enforcement.ts src/runtime/ui-executor.ts test/tool-enforcement.test.ts test/direct-mutation-fast-path.test.ts
          git diff --cached --check
          git commit -m "fix: enforce filesystem mutations through tool protocol"
          git push origin HEAD:main
