name: Refresh v3.0.2 lockfile

on:
  push:
    branches: [fix/node24-types-v3.0.2]
    paths:
      - '.github/workflows/refresh-v302-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/node24-types-v3.0.2
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Commit lockfile and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-v302-lock.yml
          git add package-lock.json
          git commit -m 'chore: lock v3.0.2 dependency graph'
          git push origin HEAD:fix/node24-types-v3.0.2
