name: Docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - src/**
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.build.json
      - src/**
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build proxy runtime target
        run: docker build --target runtime -t kitt-reverse-proxy:runtime .
      - name: Build standalone proxy with Chromium
        run: docker build --target standalone -t kitt-reverse-proxy:standalone .
      - name: Build browser sidecar
        run: docker build -f docker/browser.Dockerfile -t kitt-browser:test .
      - name: Smoke test browser sidecar
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name kitt-browser-smoke --shm-size=1g kitt-browser:test
          cleanup() {
            docker logs kitt-browser-smoke || true
            docker rm -f kitt-browser-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if docker exec kitt-browser-smoke \
              curl --fail --silent --show-error http://127.0.0.1:9222/json/version \
              >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Chromium CDP did not become ready" >&2
          exit 1
