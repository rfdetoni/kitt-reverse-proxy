name: Docker

# Docker smoke remains available for targeted release validation.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build proxy runtime target
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: kitt-reverse-proxy:runtime
          cache-from: type=gha,scope=proxy-runtime
          cache-to: type=gha,mode=max,scope=proxy-runtime
      - name: Build standalone proxy with Chromium
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: standalone
          load: true
          tags: kitt-reverse-proxy:standalone
          cache-from: type=gha,scope=proxy-standalone
          cache-to: type=gha,mode=max,scope=proxy-standalone
      - name: Build browser sidecar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/browser.Dockerfile
          load: true
          tags: kitt-browser:test
          cache-from: type=gha,scope=proxy-browser
          cache-to: type=gha,mode=max,scope=proxy-browser
      - name: Smoke test browser sidecar
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name kitt-browser-smoke --shm-size=1g kitt-browser:test
          cleanup() {
            docker logs kitt-browser-smoke || true
            docker rm -f kitt-browser-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 30); do
            if docker exec kitt-browser-smoke \
              curl --fail --silent --show-error http://127.0.0.1:9222/json/version \
              >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Chromium CDP did not become ready" >&2
          exit 1
