name: One-shot request latency telemetry

on:
  push:
    branches: [perf/request-latency-telemetry]

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-latency-telemetry
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instrument request pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/ui-response-monitor.ts')
          text = path.read_text()
          old = '''export interface UiResponseResult {
            text: string;
            deltas: string[];
          }
          '''
          new = '''export interface UiResponseResult {
            text: string;
            deltas: string[];
            firstDeltaMs?: number;
            durationMs: number;
          }
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  const deadline = Date.now() + config.uiResponseTimeoutMs;
            const deltas: string[] = [];
          '''
          new = '''  const startedAt = Date.now();
            const deadline = startedAt + config.uiResponseTimeoutMs;
            const deltas: string[] = [];
            let firstDeltaMs: number | undefined;
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''        if (delta) {
                  streamedText = active.text.trim();
          '''
          new = '''        if (delta) {
                  if (firstDeltaMs === undefined) firstDeltaMs = Math.max(0, Date.now() - startedAt);
                  streamedText = active.text.trim();
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''      if (Date.now() - stableSince >= settleMs) return { text: lastText, deltas };
          '''
          new = '''      if (Date.now() - stableSince >= settleMs) {
                return { text: lastText, deltas, firstDeltaMs, durationMs: Math.max(0, Date.now() - startedAt) };
              }
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  if (lastText && !isThinkingIndicator(lastText)) return { text: lastText, deltas };
          '''
          new = '''  if (lastText && !isThinkingIndicator(lastText)) {
              return { text: lastText, deltas, firstDeltaMs, durationMs: Math.max(0, Date.now() - startedAt) };
            }
          '''
          assert old in text
          path.write_text(text)

          path = Path('src/runtime/ui-executor.ts')
          text = path.read_text()
          old = '''  async execute(body: JsonObject, options?: ChatExecutionOptions): Promise<ChatExecutionResult> {
              throwIfAborted(options?.signal);
          '''
          new = '''  async execute(body: JsonObject, options?: ChatExecutionOptions): Promise<ChatExecutionResult> {
              const executionStartedAt = Date.now();
              throwIfAborted(options?.signal);
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    const artifactBaseline = await extractArtifactContents(this.session.page).catch(() => []);
              const baseline = await collectVisibleSnapshots(this.session.page, this.provider.ui.responseSelectors);
              await this.sendPrompt(prompt, options?.signal);

              const bufferResponse = requestMayReturnToolCalls(body) || Boolean(structured);
              const result = await this.awaitResponse(
          '''
          new = '''    const artifactBaseline = await extractArtifactContents(this.session.page).catch(() => []);
              const baseline = await collectVisibleSnapshots(this.session.page, this.provider.ui.responseSelectors);
              const promptSendStartedAt = Date.now();
              await this.sendPrompt(prompt, options?.signal);
              const promptSentAt = Date.now();

              const bufferResponse = requestMayReturnToolCalls(body) || Boolean(structured);
              const result = await this.awaitResponse(
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''    const execution: ChatExecutionResult = {
              completion: output,
              deltas,
              ...(structuredOutputFailed ? { metadata: { structured_output: 'failed' } } : {})
            };
          '''
          new = '''    const timing = {
              transport: 'ui',
              ui_prepare_ms: Math.max(0, promptSendStartedAt - executionStartedAt),
              ui_prompt_send_ms: Math.max(0, promptSentAt - promptSendStartedAt),
              ui_response_ttft_ms: result.firstDeltaMs ?? result.durationMs,
              ui_response_wait_ms: result.durationMs,
              ui_executor_total_ms: Math.max(0, Date.now() - executionStartedAt)
            };
            const execution: ChatExecutionResult = {
              completion: output,
              deltas,
              metadata: {
                ...(structuredOutputFailed ? { structured_output: 'failed' } : {}),
                timing
              }
            };
          '''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('src/runtime/session-manager.ts')
          text = path.read_text()
          old = '''import { SerialQueue } from './serial-queue.js';
          import { telemetry } from '../util/telemetry.js';
          '''
          new = '''import { SerialQueue } from './serial-queue.js';
          import { logger } from '../logger.js';
          import { telemetry } from '../util/telemetry.js';
          '''
          assert old in text
          text = text.replace(old, new, 1)
          old = '''  async execute(requestedId: string | undefined, body: JsonObject, options?: ChatExecutionOptions): Promise<ChatExecutionResult> {
              const session = await this.resolve(requestedId);
              updateRequestContext({ sessionId: session.id, provider: session.provider });
              session.lastActivity = Date.now();
              const queuedAt = Date.now();
              return session.queue.run(async () => {
                telemetry.recordQueueWait(session.provider, Date.now() - queuedAt);
                session.status = 'busy';
                session.lastActivity = Date.now();
                try {
                  return await session.executor.execute(body, options);
                } finally {
                  session.lastActivity = Date.now();
                  session.status = 'idle';
                }
              }, options?.signal);
            }
          '''
          new = '''  async execute(requestedId: string | undefined, body: JsonObject, options?: ChatExecutionOptions): Promise<ChatExecutionResult> {
              const requestStartedAt = Date.now();
              const session = await this.resolve(requestedId);
              const resolvedAt = Date.now();
              updateRequestContext({ sessionId: session.id, provider: session.provider });
              session.lastActivity = Date.now();
              const queuedAt = Date.now();
              return session.queue.run(async () => {
                const dequeuedAt = Date.now();
                const queueWaitMs = Math.max(0, dequeuedAt - queuedAt);
                telemetry.recordQueueWait(session.provider, queueWaitMs);
                session.status = 'busy';
                session.lastActivity = Date.now();
                const executorStartedAt = Date.now();
                try {
                  const result = await session.executor.execute(body, options);
                  const completedAt = Date.now();
                  const timing: JsonObject = {
                    session_resolve_ms: Math.max(0, resolvedAt - requestStartedAt),
                    queue_wait_ms: queueWaitMs,
                    executor_ms: Math.max(0, completedAt - executorStartedAt),
                    total_ms: Math.max(0, completedAt - requestStartedAt),
                    transport: session.executor.transport,
                    ...(result.metadata?.timing !== undefined ? { executor_timing: result.metadata.timing } : {})
                  };
                  logger.event('info', 'chat.timing', timing);
                  return {
                    ...result,
                    metadata: { ...(result.metadata ?? {}), timing }
                  };
                } catch (error) {
                  const failedAt = Date.now();
                  logger.event('warn', 'chat.timing', {
                    session_resolve_ms: Math.max(0, resolvedAt - requestStartedAt),
                    queue_wait_ms: queueWaitMs,
                    executor_ms: Math.max(0, failedAt - executorStartedAt),
                    total_ms: Math.max(0, failedAt - requestStartedAt),
                    transport: session.executor.transport,
                    outcome: 'error'
                  });
                  throw error;
                } finally {
                  session.lastActivity = Date.now();
                  session.status = 'idle';
                }
              }, options?.signal);
            }
          '''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('test/session-manager.test.ts')
          text = path.read_text()
          text += '''\n\ntest('session manager attaches per-request latency timing metadata', async () => {\n  const manager = new SessionManager({\n    defaultExecutor: executor('default'),\n    provider: 'chatgpt',\n    config\n  });\n  try {\n    const result = await manager.execute(undefined, { messages: [{ role: 'user', content: 'timing' }] });\n    const timing = result.metadata?.timing as JsonObject | undefined;\n    assert.ok(timing);\n    assert.equal(timing.transport, 'ui');\n    for (const key of ['session_resolve_ms', 'queue_wait_ms', 'executor_ms', 'total_ms']) {\n      assert.equal(typeof timing[key], 'number');\n      assert.ok((timing[key] as number) >= 0);\n    }\n  } finally {\n    await manager.close();\n  }\n});\n'''
          path.write_text(text)
          PY
      - name: Validate telemetry
        run: |
          npm ci
          npm run verify
      - name: Commit implementation
        run: |
          rm .github/workflows/one-shot-request-latency-telemetry.yml
          git config user.name 'kitt-telemetry-bot'
          git config user.email 'kitt-telemetry-bot@users.noreply.github.com'
          git add src/runtime/ui-response-monitor.ts src/runtime/ui-executor.ts src/runtime/session-manager.ts test/session-manager.test.ts .github/workflows/one-shot-request-latency-telemetry.yml
          git commit -m 'perf(metrics): instrument proxy latency phases'
          git push origin HEAD:perf/request-latency-telemetry
