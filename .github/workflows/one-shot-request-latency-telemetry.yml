name: One-shot request latency telemetry

on:
  push:
    branches: [perf/request-latency-telemetry]

permissions:
  contents: write

jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/request-latency-telemetry
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply timing instrumentation
        run: python scripts/_apply_request_latency_telemetry.py
      - name: Validate timing instrumentation
        run: |
          git diff --check
          npm ci
          npm run verify
      - name: Commit implementation
        run: |
          rm -f .github/workflows/one-shot-request-latency-telemetry*.yml scripts/_apply_request_latency_telemetry.py .telemetry-trigger
          git config user.name 'kitt-telemetry-bot'
          git config user.email 'kitt-telemetry-bot@users.noreply.github.com'
          git add -A
          git commit -m 'perf(metrics): instrument proxy latency phases'
          git push origin HEAD:perf/request-latency-telemetry
