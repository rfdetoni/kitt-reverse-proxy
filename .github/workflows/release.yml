name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Semantic release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - run: npm run verify
      - name: Verify release tag, package metadata and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root="$(node -p "require('./package-lock.json').packages[''].version")"
          package_version="${expected#v}"
          if [[ "$RELEASE_TAG" != "$expected" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $expected" >&2
            exit 1
          fi
          if [[ "$lock_version" != "$package_version" || "$lock_root" != "$package_version" ]]; then
            echo "package.json/package-lock.json version drift: package=$package_version lock=$lock_version root=$lock_root" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be strict semantic version vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          git fetch origin main --no-tags
          tag_commit="$(git rev-list -n1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tag $RELEASE_TAG points to $tag_commit, which is not part of main history." >&2
            exit 1
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Build npm archive and SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          npm pack --pack-destination release
          npm sbom --sbom-format=cyclonedx --omit=dev > release/sbom.cdx.json
      - name: Attest npm package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
          sbom-path: release/sbom.cdx.json
      - name: Build portable precompiled runtime bundles
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          npm prune --omit=dev --ignore-scripts --no-audit --no-fund

          runtime_dir="release/runtime"
          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"
          cp -R dist node_modules "$runtime_dir/"
          cp package.json README.md SECURITY.md LICENSE "$runtime_dir/"
          rm -rf "$runtime_dir/node_modules/.bin"

          tar -C "$runtime_dir" -czf "release/kitt-reverse-proxy-runtime-${version}.tar.gz" .
          (
            cd "$runtime_dir"
            zip -q -r "../kitt-reverse-proxy-runtime-${version}.zip" .
          )
          rm -rf "$runtime_dir"

          (
            cd release
            sha256sum ./*.tgz ./*.tar.gz ./*.zip sbom.cdx.json > SHA256SUMS
          )
      - name: Attest portable runtime bundles
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/kitt-reverse-proxy-runtime-*.tar.gz
            release/kitt-reverse-proxy-runtime-*.zip

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate runtime image metadata
        id: runtime-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kitt-reverse-proxy
          flavor: latest=auto
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=K.I.T.T. reverse-proxy runtime for the browser-sidecar architecture
            org.opencontainers.image.licenses=MIT
      - name: Publish reverse-proxy runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: true
          platforms: linux/amd64
          tags: ${{ steps.runtime-meta.outputs.tags }}
          labels: ${{ steps.runtime-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=proxy-runtime
          cache-to: type=gha,mode=max,scope=proxy-runtime

      - name: Generate standalone image metadata
        id: standalone-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kitt-reverse-proxy-standalone
          flavor: latest=auto
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=K.I.T.T. reverse proxy with bundled Playwright Chromium
            org.opencontainers.image.licenses=MIT
      - name: Publish standalone reverse-proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: standalone
          push: true
          platforms: linux/amd64
          tags: ${{ steps.standalone-meta.outputs.tags }}
          labels: ${{ steps.standalone-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=proxy-standalone
          cache-to: type=gha,mode=max,scope=proxy-standalone

      - name: Generate browser image metadata
        id: browser-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/kitt-reverse-proxy-browser
          flavor: latest=auto
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=K.I.T.T. isolated Chromium sidecar with optional noVNC authentication UI
            org.opencontainers.image.licenses=MIT
      - name: Publish browser sidecar image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/browser.Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.browser-meta.outputs.tags }}
          labels: ${{ steps.browser-meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=proxy-browser
          cache-to: type=gha,mode=max,scope=proxy-browser

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; nothing to do."
            exit 0
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Expected immutable release tag $RELEASE_TAG was not found." >&2
            exit 1
          else
            echo "Expected release tag $RELEASE_TAG was not found." >&2
            exit 1
          fi
