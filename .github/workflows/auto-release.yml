name: Automatic Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: true

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validated reverse-proxy commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Validate immutable release candidate
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          current="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root="$(node -p "require('./package-lock.json').packages[''].version")"

          if [[ "$current" != "$lock_version" || "$current" != "$lock_root" ]]; then
            echo "Package metadata mismatch: package=$current lock=$lock_version root=$lock_root" >&2
            exit 1
          fi
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Package version must be strict semantic version: $current" >&2
            exit 1
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ ! "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest published release is not strict semver: $latest_tag" >&2
            exit 1
          fi
          latest="${latest_tag#v}"
          relation="$(node - "$current" "$latest" <<'NODE'
          const parse = (raw) => {
            if (!/^\d+\.\d+\.\d+$/.test(raw)) {
              throw new Error(`invalid semantic version: ${raw}`);
            }
            return raw.split('.').map(Number);
          };
          const compare = (a, b) => {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] < b[i]) return 'behind';
              if (a[i] > b[i]) return 'ahead';
            }
            return 'equal';
          };
          console.log(compare(parse(process.argv[2]), parse(process.argv[3])));
          NODE
          )"

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "relation=$relation" >> "$GITHUB_OUTPUT"

          if [[ "$relation" == "behind" ]]; then
            echo "Validated candidate $current is behind latest release $latest; refusing release." >&2
            exit 1
          fi

      - name: No release required
        if: steps.state.outputs.relation == 'equal'
        run: echo "Validated main already matches v${{ steps.state.outputs.current }}; no release required."

      - name: Tag and dispatch validated release
        if: steps.state.outputs.relation == 'ahead'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.state.outputs.current }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${CURRENT_VERSION}"
          head="$(git rev-parse HEAD)"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tagged="$(git rev-list -n1 "$tag")"
            if [[ "$tagged" != "$head" ]]; then
              echo "Immutable tag $tag already points to $tagged, expected validated SHA $head." >&2
              exit 1
            fi
            echo "Tag $tag already points to validated SHA $head."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/$tag" \
              -f sha="$head" >/dev/null
            echo "Created immutable tag $tag at validated SHA $head."
          fi

          gh workflow run release.yml --ref "$tag" -f tag="$tag"
