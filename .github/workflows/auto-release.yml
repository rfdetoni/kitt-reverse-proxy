name: Automatic Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: automatic-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Calculate next semantic version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          current="$(node -p "require('./package.json').version")"
          next="$(python .github/scripts/next_semver.py "$current")"
          if [[ -z "$next" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since the latest semantic tag."
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - name: Update package version
        if: steps.version.outputs.release == 'true' && steps.version.outputs.next != steps.version.outputs.current
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: npm version "$NEXT_VERSION" --no-git-tag-version --allow-same-version
      - name: Commit version bump
        if: steps.version.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): ${RELEASE_TAG}"
            git push origin HEAD:main
          fi
      - name: Dispatch validated release pipeline
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run release.yml --ref main -f tag="$RELEASE_TAG"
