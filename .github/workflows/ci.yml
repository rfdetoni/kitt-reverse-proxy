name: CI

on:
  push:
    branches: [main] # Automatic release requires a successful main CI
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Checkout authoritative Agent contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rfdetoni/kitt-protocol
          ref: 2cb05bb03e54eb2dc5f81bf151edcbd207ff194e
          path: protocol-source
          persist-credentials: false
      - name: Check generated Agent response schema
        run: python3 protocol-source/scripts/export_agent_contract.py --check --output src/contracts/agent-contract.ts
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      # npm test compiles the same tsconfig.json before executing the tests.
      - name: Typecheck and run release-critical contracts
        run: npm test
      - name: Build production package
        run: npm run build
      - name: Install Chromium for the real CDP boundary
        if: github.event_name != 'pull_request'
        run: npx playwright install --with-deps chromium
      - name: Verify CDP source integrity in real Chromium
        if: github.event_name != 'pull_request'
        # Production dist was already compiled above.
        run: node --test integration/cdp-browser.test.mjs
      - name: Validate published package contents
        # The explicit production build already ran prepack's build command.
        run: npm pack --dry-run --ignore-scripts
      - name: Validate compiled CLI output
        run: node --check dist/cli.js
      - name: Validate POSIX installer syntax
        run: bash -n install.sh
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=moderate
