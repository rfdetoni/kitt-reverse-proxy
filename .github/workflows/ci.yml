name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm
      - name: Checkout authoritative Agent contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rfdetoni/kitt-protocol
          ref: cc3b51dd0e868adaab4ed7a0069c4dbf9aa08c42
          path: protocol-source
          persist-credentials: false
      - name: Check generated Agent response schema
        run: python3 protocol-source/scripts/export_agent_contract.py --check --output src/contracts/agent-contract.ts
      - name: Check generated KAP parser parity
        run: |
          cmp protocol-source/sdk/typescript/src/kap.ts src/contracts/kap.ts
          cmp protocol-source/sdk/typescript/src/kap2.ts src/contracts/kap2.ts
          cmp protocol-source/sdk/typescript/src/kap-version.ts src/contracts/kap-version.ts
          cmp protocol-source/sdk/typescript/src/kap-error.ts src/contracts/kap-error.ts
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Typecheck critical surface
        run: npm run check
      - name: Run release-critical contracts
        run: npm test
      - name: Build production package
        run: npm run build
      - name: Validate authoritative KAP/2 golden corpus against proxy parser
        run: node scripts/verify-kap2-corpus.mjs protocol-source/fixtures/kap2
      - name: Install Chromium for the real CDP boundary
        run: npx playwright install --with-deps chromium
      - name: Verify CDP source integrity in real Chromium
        run: npm run test:browser
      - name: Validate multicore installer build
        run: node scripts/build-fast.mjs
      - name: Validate fast-build output
        run: node --check dist/cli.js
      - name: Validate POSIX installer syntax
        run: bash -n install.sh
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate published package contents
        run: npm pack --dry-run
