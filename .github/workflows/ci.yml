name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - name: Checkout authoritative Agent contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rfdetoni/kitt-protocol
          ref: c3bb542f81f8808f0d93f950ab6af5c223fddf4b
          path: protocol-source
          persist-credentials: false
      - name: Check generated Agent response schema
        run: python3 protocol-source/scripts/export_agent_contract.py --check --output src/contracts/agent-contract.ts
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Typecheck critical surface
        run: npm run check
      - name: Run release-critical contracts
        run: npm test
      - name: Build production package
        run: npm run build
      - name: Install Chromium for the real CDP boundary
        run: npx playwright install --with-deps chromium
      - name: Verify CDP source integrity in real Chromium
        run: npm run test:browser
      - name: Validate multicore installer build
        run: node scripts/build-fast.mjs
      - name: Validate fast-build output
        run: node --check dist/cli.js
      - name: Validate POSIX installer syntax
        run: bash -n install.sh
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate published package contents
        run: npm pack --dry-run
