name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci --no-audit --no-fund --strict-allow-scripts
      - name: Typecheck critical surface
        run: npm run check
      - name: Run release-critical contracts
        run: npm test
      - name: Build production package
        run: npm run build
      - name: Validate multicore installer build
        run: node scripts/build-fast.mjs
      - name: Validate fast-build output
        run: node --check dist/cli.js
      - name: Validate POSIX installer syntax
        run: bash -n install.sh
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Validate published package contents
        run: npm pack --dry-run
