name: One-shot direct mutation fast path

on:
  push:
    branches: [perf/shared-session-fast-path]
    paths:
      - .github/workflows/one-shot-direct-mutation-fast-path.yml

permissions:
  contents: write

jobs:
  apply-fast-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: perf/shared-session-fast-path

      - name: Apply enforcement fast path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/runtime/tool-enforcement.ts')
          text = path.read_text(encoding='utf-8')
          marker = '''const CHANGE_INTENT =\n  /\\b(?:fix|corrig(?:ir|a|e|indo)?|implement(?:ar|e|a)?|add|adicion(?:ar|e|a)?|remove|remov(?:er|a)|refactor|refator(?:ar|e)|improve|melhor(?:ar|e)|aprimor(?:ar|e)|change|alter(?:ar|e)|edit|editar|create|criar|update|atualiz(?:ar|e)|review|revis(?:ar|e)|debug|investig(?:ar|ue)|resolve|resolver)\\b/i;\n'''
          replacement = marker + '''const DIRECT_FILESYSTEM_MUTATION =\n  /^\\s*(?:(?:por favor|please)\\s+)?(?:(?:crie|criar|create|make)\\s+(?:(?:um|uma|a|an)\\s+)?(?:pasta|diret[oó]rio|folder|directory)\\b|(?:execute|executar|rode|run)\\s*:?\\s*(?:mkdir|touch)\\b)/i;\n'''
          if marker not in text:
              raise SystemExit('change intent marker not found')
          text = text.replace(marker, replacement, 1)

          old = '''  const workspaceDependent = isWorkspaceDependentRequest(latestUserText);\n  const explorationTools = plan.tools.filter((tool) =>\n    isDedicatedExplorationTool(tool) || isMixedShellTool(tool) || tool.name === 'kitt_runtime'\n  );\n  const requireExploration = explorationTools.length > 0 && workspaceDependent;\n\n  return {\n    enabled: mode === 'required' || workspaceDependent,\n    mode,\n    workspaceDependent,\n    requireExploration,\n    requireAnyTool: mode === 'required',\n    explorationToolNames: explorationTools.map((tool) => tool.name)\n  };\n'''
          new = '''  const directFilesystemMutation = DIRECT_FILESYSTEM_MUTATION.test(latestUserText);\n  const workspaceDependent = !directFilesystemMutation && isWorkspaceDependentRequest(latestUserText);\n  const explorationTools = plan.tools.filter((tool) =>\n    isDedicatedExplorationTool(tool) || isMixedShellTool(tool) || tool.name === 'kitt_runtime'\n  );\n  const requireExploration = explorationTools.length > 0 && workspaceDependent;\n\n  return {\n    enabled: mode === 'required' || workspaceDependent || directFilesystemMutation,\n    mode,\n    workspaceDependent,\n    requireExploration,\n    requireAnyTool: mode === 'required' || directFilesystemMutation,\n    explorationToolNames: explorationTools.map((tool) => tool.name)\n  };\n'''
          if old not in text:
              raise SystemExit('enforcement plan block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('test/direct-mutation-fast-path.test.ts').write_text('''import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport { buildToolEnforcementPlan, enforceToolResponse } from '../src/runtime/tool-enforcement.js';\n\nconst protocol = {\n  tools: [{ name: 'kitt_runtime', description: 'safe runtime', parameters: { type: 'object' } }],\n  choice: { mode: 'auto' },\n  systemPrompt: ''\n} as any;\n\ntest('direct folder creation requires a tool without workspace exploration', () => {\n  const plan = buildToolEnforcementPlan(protocol, 'crie uma pasta teste', 'explore-first');\n  assert.equal(plan.enabled, true);\n  assert.equal(plan.workspaceDependent, false);\n  assert.equal(plan.requireExploration, false);\n  assert.equal(plan.requireAnyTool, true);\n});\n\ntest('direct mkdir command does not require an exploratory round trip', () => {\n  const plan = buildToolEnforcementPlan(protocol, 'execute: mkdir -p teste', 'explore-first');\n  assert.equal(plan.requireExploration, false);\n  assert.equal(plan.requireAnyTool, true);\n\n  assert.throws(() => enforceToolResponse({\n    enforcement: plan,\n    protocol,\n    calls: [],\n    explorationEvidence: false,\n    toolEvidence: false\n  }), /At least one tool call is required/);\n\n  assert.doesNotThrow(() => enforceToolResponse({\n    enforcement: plan,\n    protocol,\n    calls: [{\n      id: 'call1',\n      type: 'function',\n      function: {\n        name: 'kitt_runtime',\n        arguments: JSON.stringify({ operation: 'process.run', arguments: { command: 'mkdir -p teste' } })\n      }\n    }] as any,\n    explorationEvidence: false,\n    toolEvidence: false\n  }));\n});\n''', encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          npm ci
          npm run check
          npm test -- --test-name-pattern='direct folder|direct mkdir' || npm test

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "kitt-perf-bot"
          git config user.email "kitt-perf-bot@users.noreply.github.com"
          git rm .github/workflows/one-shot-direct-mutation-fast-path.yml
          git add src/runtime/tool-enforcement.ts test/direct-mutation-fast-path.test.ts
          git diff --cached --check
          git commit -m "perf(tools): skip exploration for direct filesystem actions"
          git push origin HEAD:perf/shared-session-fast-path
